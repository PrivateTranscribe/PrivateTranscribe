name: Release to Production (R2)

on:
  push:
    branches:
      - production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Verify version was bumped
        if: github.event_name == 'push'
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD~1:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          echo "Previous version: $PREVIOUS"
          echo "Current version:  $CURRENT"
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "ERROR: Version in package.json was not bumped. Update the version before pushing to production."
            exit 1
          fi
          echo "Version bumped: $PREVIOUS -> $CURRENT"

      - name: Confirm manually dispatched version
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual production release for version $(node -p \"require('./package.json').version\")"

  build-windows:
    runs-on: windows-latest
    needs: check-version-bump
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download whisper.cpp binaries
        run: node scripts/download-whisper-cpp.js --current
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download nircmd.exe
        run: node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Compile native helpers
        run: npm run compile:native

      - name: Verify fast paste helper was built
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/bin/windows-fast-paste.exe")) {
            Write-Error "windows-fast-paste.exe is missing. Auto-paste into terminals would silently fall back to Ctrl+V."
            exit 1
          }

      - name: Cache Electron
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/electron/Cache
          key: windows-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: windows-electron-

      # Licensing moved onto the updater's hostname so that blocking it also
      # blocks updates. If the Cloudflare worker is not routed, that path 404s
      # from R2 and every install from this build would be unable to activate
      # Pro. Fail the release here instead of shipping a build that cannot sell.
      - name: Verify the licensing endpoint is live
        shell: pwsh
        run: |
          $url = 'https://updates.privatetranscribe.com/licensing/activate'
          $body = '{"key":"PREFLIGHT-CHECK","deviceId":"preflight","deviceName":"ci"}'
          try {
            $res = Invoke-WebRequest -Uri $url -Method Post -Body $body `
              -ContentType 'application/json' -UseBasicParsing -SkipHttpErrorCheck -TimeoutSec 20
          } catch {
            throw "Licensing endpoint $url is unreachable: $($_.Exception.Message). Deploy infra/updates-worker before releasing."
          }

          # A bogus key is expected to be rejected. What matters is that the
          # worker answered with the function's JSON, not that R2 served a 404.
          try {
            $parsed = $res.Content | ConvertFrom-Json
          } catch {
            throw "Licensing endpoint $url did not return JSON (HTTP $($res.StatusCode)). The Cloudflare worker route is probably missing, so R2 is serving this path. Deploy infra/updates-worker."
          }

          if ($null -eq $parsed.PSObject.Properties['success']) {
            throw "Licensing endpoint $url returned JSON without a 'success' field (HTTP $($res.StatusCode)). Check the worker's function allowlist."
          }

          Write-Host "Licensing endpoint answered on the updater hostname (HTTP $($res.StatusCode))."

      # Fail here rather than 10 minutes later inside electron-builder, where a
      # missing credential surfaces as an opaque Azure auth error.
      - name: Verify Azure signing credentials are present
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }

          if ($missing) {
            throw "Windows releases must be signed. Missing secrets: $($missing -join ', '). The client secret expires; if it was working and now is not, renew it on the PrivateTranscribe-Signing-CI app registration."
          }

      # signAndEditExecutable is false in electron-builder.json so a local
      # `npm run pack` never reaches Azure and never needs credentials. It is
      # turned on here instead. Forgetting it does not ship an unsigned build:
      # the verification step below fails first.
      - name: Build Windows installer
        # --publish never: we handle upload manually to R2 below
        # Long-form --config.* on purpose. The short -c.win.signAndEditExecutable
        # form is parsed as a config *file path* and the build dies with ENOENT.
        run: npm run build:win -- --publish never --config.forceCodeSigning=true --config.win.signAndEditExecutable=true
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # Runs before the R2 upload on purpose. An unsigned or wrongly signed
      # installer that reaches the bucket is one users download and the updater
      # then refuses, so the build must fail instead of publishing.
      - name: Verify Windows signatures
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: Julsgaard Products
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path dist -Filter "*.exe" -File
          $artifacts += Get-ChildItem -Path dist/win-unpacked -Filter "PrivateTranscribe.exe" -File -ErrorAction SilentlyContinue

          if ($artifacts.Count -eq 0) {
            throw "No Windows executable artifacts found to verify."
          }

          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($artifact.Name): $($signature.StatusMessage)"
            }

            $subject = $signature.SignerCertificate.Subject
            if ($subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
              throw "Unexpected signing publisher for $($artifact.Name): $subject"
            }

            # Artifact Signing certificates are valid for only a few days, so an
            # untimestamped signature stops verifying almost immediately after
            # release. electron-builder has shipped Azure-signed binaries with no
            # timestamp before (electron-builder#8626), so assert it rather than
            # trusting the config.
            if (-not $signature.TimeStamperCertificate) {
              throw "No timestamp on $($artifact.Name). The signature would expire with the certificate within days."
            }
          }

          Write-Host "Verified $($artifacts.Count) signed artifact(s) as '$env:EXPECTED_PUBLISHER', all timestamped."

      - name: Upload artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ACCOUNT_ENDPOINT }}
          R2_BUCKET: privatetranscribe-assets
        run: |
          pip install awscli --quiet

          # Upload installer + portable exe
          for f in dist/*.exe; do
            aws s3 cp "$f" "s3://$R2_BUCKET/win/$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress
            echo "Uploaded: $f"
          done

          # Upload differential update blockmaps alongside installers.
          for f in dist/*.exe.blockmap; do
            [ -e "$f" ] || continue
            aws s3 cp "$f" "s3://$R2_BUCKET/win/$(basename "$f")" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress
            echo "Uploaded: $f"
          done

          # Upload latest.yml (the update manifest — must come last)
          aws s3 cp dist/latest.yml "s3://$R2_BUCKET/win/latest.yml" \
            --endpoint-url "$R2_ENDPOINT" \
            --no-progress \
            --cache-control "no-cache, no-store"

          echo "Done. Update manifest uploaded last."

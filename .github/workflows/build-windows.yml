name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload artifacts to R2'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download native binaries
        run: |
          npm run compile:native
          npm run download:whisper-cpp
          node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_CPP_VERSION: b9016

      - name: Verify fast paste helper was built
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/bin/windows-fast-paste.exe")) {
            Write-Error "windows-fast-paste.exe is missing. Auto-paste into terminals would silently fall back to Ctrl+V."
            exit 1
          }

      - name: Build renderer
        run: npm run build:renderer

      - name: Package (Windows NSIS + Portable)
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code signing (uncomment when cert is configured):
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: List build artifacts
        run: dir dist\
        shell: cmd

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-windows-setup
          path: |
            dist/PrivateTranscribe Setup *.exe
            dist/PrivateTranscribe-Setup-*.exe
          retention-days: 7

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-windows-portable
          path: |
            dist/PrivateTranscribe-*.exe
            !dist/PrivateTranscribe Setup *.exe
            !dist/PrivateTranscribe-Setup-*.exe
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload latest.yml (update manifest)
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-update-manifest
          path: dist/latest.yml
          retention-days: 7

      # Optional: upload to Cloudflare R2
      # Uncomment when R2 bucket and credentials are configured
      # - name: Upload to R2
      #   if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     command: r2 object put privatetranscribe-assets/updates/win/latest.yml --file dist/latest.yml
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

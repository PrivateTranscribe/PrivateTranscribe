name: Build Windows test installer

# A signed installer to try before a release, for example on a PC with Smart App
# Control on, which blocks unsigned builds. It never publishes. Installers reach
# users only through release.yml, which also checks the version is untagged.
# This workflow used to upload to the update feed and to run on any pushed v*
# tag, and 0.14.1 and 0.14.2 reached users that way.
#
# It is not marked as an official build (no privatetranscribeOfficialBuild
# extraMetadata), so an installed test copy never checks for app updates or
# sends analytics.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The whole of prepare:resources, which is what build:win runs before every
      # release. A shorter hand-picked list is how this workflow drifted: it
      # pinned an old llama.cpp and stopped passing once afterPack probed
      # llama-server.
      - name: Prepare bundled resources
        run: npm run prepare:resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify fast paste helper was built
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/bin/windows-fast-paste.exe")) {
            Write-Error "windows-fast-paste.exe is missing. Auto-paste would be skipped and every dictation left on the clipboard."
            exit 1
          }

      - name: Build renderer
        run: npm run build:renderer

      # OIDC login and an immediate token fetch, as in release.yml: GitHub's
      # assertion lives 5 minutes and the Azure CLI cannot renew it.
      - name: Azure login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Prefetch the code signing token
        shell: pwsh
        run: |
          $expires = az account get-access-token --resource https://codesigning.azure.net --query expiresOn --output tsv
          if ($LASTEXITCODE -ne 0) { throw "Could not get a code signing token from Azure." }
          Write-Host "Code signing token valid until $expires"

      # signAndEditExecutable is false in electron-builder.json so a local
      # `npm run pack` never reaches Azure and never needs credentials. It is
      # turned on here instead. Forgetting it does not ship an unsigned build:
      # the verification step below fails first.
      - name: Package (Windows NSIS + Portable)
        # Long-form --config.* on purpose. The short -c.win.signAndEditExecutable
        # form is parsed as a config *file path* and the build dies with ENOENT.
        run: npx electron-builder --win --publish never --config.forceCodeSigning=true --config.win.signAndEditExecutable=true --config.win.signExecutable=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Windows signatures
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: Julsgaard Products
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path dist -Filter "*.exe" -File
          $artifacts += Get-ChildItem -Path dist/win-unpacked -Filter "PrivateTranscribe.exe" -File -ErrorAction SilentlyContinue

          if ($artifacts.Count -eq 0) {
            throw "No Windows executable artifacts found to verify."
          }

          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($artifact.Name): $($signature.StatusMessage)"
            }

            $subject = $signature.SignerCertificate.Subject
            if ($subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
              throw "Unexpected signing publisher for $($artifact.Name): $subject"
            }

            # Artifact Signing certificates are valid for only a few days, so an
            # untimestamped signature stops verifying almost immediately after
            # release. electron-builder has shipped Azure-signed binaries with no
            # timestamp before (electron-builder#8626), so assert it rather than
            # trusting the config.
            if (-not $signature.TimeStamperCertificate) {
              throw "No timestamp on $($artifact.Name). The signature would expire with the certificate within days."
            }
          }

          Write-Host "Verified $($artifacts.Count) signed artifact(s) as '$env:EXPECTED_PUBLISHER', all timestamped."

      - name: List build artifacts
        run: dir dist\
        shell: cmd

      - name: Upload NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privatetranscribe-windows-setup
          path: |
            dist/PrivateTranscribe Setup *.exe
            dist/PrivateTranscribe-Setup-*.exe
          retention-days: 7

      - name: Upload portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: privatetranscribe-windows-portable
          path: |
            dist/PrivateTranscribe-*.exe
            !dist/PrivateTranscribe Setup *.exe
            !dist/PrivateTranscribe-Setup-*.exe
          if-no-files-found: ignore
          retention-days: 7

name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload artifacts to R2"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download native binaries
        run: |
          npm run compile:native
          npm run download:whisper-cpp
          node scripts/download-nircmd.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLAMA_CPP_VERSION: b9016

      - name: Verify fast paste helper was built
        shell: pwsh
        run: |
          if (-not (Test-Path "resources/bin/windows-fast-paste.exe")) {
            Write-Error "windows-fast-paste.exe is missing. Auto-paste into terminals would silently fall back to Ctrl+V."
            exit 1
          }

      - name: Build renderer
        run: npm run build:renderer

      # Fail here rather than 10 minutes later inside electron-builder, where a
      # missing credential surfaces as an opaque Azure auth error.
      - name: Verify Azure signing credentials are present
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @('AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET') |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }

          if ($missing) {
            throw "Windows releases must be signed. Missing secrets: $($missing -join ', '). The client secret expires; if it was working and now is not, renew it on the PrivateTranscribe-Signing-CI app registration."
          }

      # signAndEditExecutable is false in electron-builder.json so a local
      # `npm run pack` never reaches Azure and never needs credentials. It is
      # turned on here instead. Forgetting it does not ship an unsigned build:
      # the verification step below fails first.
      - name: Package (Windows NSIS + Portable)
        # Long-form --config.* on purpose. The short -c.win.signAndEditExecutable
        # form is parsed as a config *file path* and the build dies with ENOENT.
        run: npx electron-builder --win --publish never --config.forceCodeSigning=true --config.win.signAndEditExecutable=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Verify Windows signatures
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: Julsgaard Products
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem -Path dist -Filter "*.exe" -File
          $artifacts += Get-ChildItem -Path dist/win-unpacked -Filter "PrivateTranscribe.exe" -File -ErrorAction SilentlyContinue

          if ($artifacts.Count -eq 0) {
            throw "No Windows executable artifacts found to verify."
          }

          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -LiteralPath $artifact.FullName

            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $($artifact.Name): $($signature.StatusMessage)"
            }

            $subject = $signature.SignerCertificate.Subject
            if ($subject -notlike "*CN=$env:EXPECTED_PUBLISHER*") {
              throw "Unexpected signing publisher for $($artifact.Name): $subject"
            }

            # Artifact Signing certificates are valid for only a few days, so an
            # untimestamped signature stops verifying almost immediately after
            # release. electron-builder has shipped Azure-signed binaries with no
            # timestamp before (electron-builder#8626), so assert it rather than
            # trusting the config.
            if (-not $signature.TimeStamperCertificate) {
              throw "No timestamp on $($artifact.Name). The signature would expire with the certificate within days."
            }
          }

          Write-Host "Verified $($artifacts.Count) signed artifact(s) as '$env:EXPECTED_PUBLISHER', all timestamped."

      - name: List build artifacts
        run: dir dist\
        shell: cmd

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-windows-setup
          path: |
            dist/PrivateTranscribe Setup *.exe
            dist/PrivateTranscribe-Setup-*.exe
          retention-days: 7

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-windows-portable
          path: |
            dist/PrivateTranscribe-*.exe
            !dist/PrivateTranscribe Setup *.exe
            !dist/PrivateTranscribe-Setup-*.exe
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload latest.yml (update manifest)
        uses: actions/upload-artifact@v7
        with:
          name: privatetranscribe-update-manifest
          path: dist/latest.yml
          retention-days: 7

      # Optional: upload to Cloudflare R2
      # Uncomment when R2 bucket and credentials are configured
      # - name: Upload to R2
      #   if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish == 'true'
      #   uses: cloudflare/wrangler-action@v3
      #   with:
      #     command: r2 object put privatetranscribe-assets/updates/win/latest.yml --file dist/latest.yml
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #     CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

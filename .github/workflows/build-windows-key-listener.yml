name: Build Windows Key Listener

on:
  push:
    paths:
      - "resources/windows-key-listener.c"
      - ".github/workflows/build-windows-key-listener.yml"
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g., 1.0.1)"
        required: false
        default: "1.0.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # step-security/msvc-dev-cmd requires a paid subscription on private
      # repositories, which fails this job outright. Call vcvars64.bat directly
      # instead — it is what the action does anyway. See build-cuda-binary.yml.
      - name: Locate MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }

          $installPath = & $vswhere -latest -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installPath) { throw "No Visual Studio install with the C++ toolset was found." }

          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }

          Write-Host "Using $vcvars"
          "VCVARS64=$vcvars" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile Windows Key Listener
        run: |
          call "%VCVARS64%" || exit /b 1
          cl /O2 /nologo resources/windows-key-listener.c /Fe:windows-key-listener.exe user32.lib
        shell: cmd

      - name: Verify binary
        run: |
          if (Test-Path "windows-key-listener.exe") {
            Write-Host "Binary built successfully"
            Get-Item "windows-key-listener.exe" | Select-Object Name, Length
          } else {
            Write-Error "Binary not found"
            exit 1
          }
        shell: pwsh

      - name: Create zip archive
        run: |
          Compress-Archive -Path windows-key-listener.exe -DestinationPath windows-key-listener-win32-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-key-listener
          path: windows-key-listener-win32-x64.zip
          retention-days: 7

      - name: Create or update release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: windows-key-listener-v${{ inputs.version || '1.0.1' }}
          name: Windows Key Listener v${{ inputs.version || '1.0.1' }}
          body: |
            Prebuilt Windows key listener binary for Push-to-Talk functionality.

            This binary uses Windows Low-Level Keyboard Hook to detect key press/release events.
          files: windows-key-listener-win32-x64.zip
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
